<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — AI Study</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(50, 50, 100, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #5b5ce2;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f2340;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #5b5ce2;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #5b5ce2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #4647c7;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .register a {
            color: #5b5ce2;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🎓 AI Study</div>

    <h1>С возвращением!</h1>

    <p class="subtitle">
        Войдите, чтобы продолжить обучение
    </p>

    <form method="POST">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Введите email"
            required
        >

        <label for="password">Пароль</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Введите пароль"
            required
        >

        <button class="login-button" type="submit">
            Войти
        </button>

    </form>

    <div class="register">
        Нет аккаунта?
        <a href="/register">Зарегистрироваться</a>
    </div>

    <a class="back" href="/">
        ← Вернуться на главную
    </a>

</div>

</body>
</html>S
